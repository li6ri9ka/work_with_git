name: Security Checks
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Run security scan
        uses: actions/github-script@v6
        with:
          script: |
            console.log('Security scan placeholder')
    
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .github/gitleaks.toml

      - name: Check for Docker files
        id: check_docker
        run: |
          echo "dockerfile_exists=$( [ -f Dockerfile ] && echo true || echo false )" >> $GITHUB_OUTPUT
          echo "compose_exists=$( [ -f docker-compose.yml ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Scan Docker for vulnerabilities
        if: steps.check_docker.outputs.dockerfile_exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'

      - name: Add security label
        if: success()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: 'security-passed'
