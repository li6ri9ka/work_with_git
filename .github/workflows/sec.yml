name: "1. Security Checks"
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Antivirus Scan
        uses: trufflesecurity/clamav-action@v2
        with:
          scan-dir: ./
          fail-on-found: true

      - name: Scan for secrets in code
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .github/gitleaks.toml

     
      - name: Check for docker-compose.yml
        id: check_files
        run: |
          if [ -f "docker-compose.yml" ]; then
            echo "docker_exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Scan Docker for vulnerabilities
        if: steps.check_files.outputs.docker_exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'

      - name: Add sec-passed label
        if: success()
        uses: actions-ecosystem/action-add-labels@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          labels: sec-passed
