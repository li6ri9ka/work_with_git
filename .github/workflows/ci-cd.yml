name: Version and Changelog Update

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  version-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR metadata
        id: pr-meta
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
            });
            return {
              labels: pr.data.labels.map(label => label.name),
              branch: pr.data.head.ref,
              title: pr.data.title,
              number: pr.data.number
            };

      - name: Determine update type
        id: update-type
        run: |
          if [[ "${{ steps.pr-meta.outputs.labels }}" == *"feature"* ]]; then
            echo "TYPE=minor" >> $GITHUB_OUTPUT
            echo "LOG_TYPE=Feature" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.pr-meta.outputs.labels }}" == *"hotfix"* ]]; then
            echo "TYPE=patch" >> $GITHUB_OUTPUT
            echo "LOG_TYPE=Hotfix" >> $GITHUB_OUTPUT
          else
            echo "No version update needed"
            exit 0
          fi

      - name: Get current version
        id: current-ver
        run: |
          if [ -f "version" ]; then
            echo "VERSION=$(cat version)" >> $GITHUB_OUTPUT
          else
            echo "VERSION=0.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: new-ver
        run: |
          IFS='.' read -ra PARTS <<< "${{ steps.current-ver.outputs.VERSION }}"
          MAJOR=${PARTS[0]}
          MINOR=${PARTS[1]}
          PATCH=${PARTS[2]}

          if [ "${{ steps.update-type.outputs.TYPE }}" == "minor" ]; then
            NEW_VERSION="$MAJOR.$((MINOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "OLD_VERSION=${{ steps.current-ver.outputs.VERSION }}" >> $GITHUB_OUTPUT

      - name: Update version file
        run: echo "${{ steps.new-ver.outputs.VERSION }}" > version

      - name: Update changelog
        run: |
          # Создаем файл если не существует
          if [ ! -f "changelog.md" ]; then
            echo "# Changelog\n" > changelog.md
          fi

          TIMESTAMP=$(date +"%Y-%m-%d")
          ENTRY="## ${{ steps.new-ver.outputs.VERSION }} ($TIMESTAMP)\n"
          ENTRY+="- **${{ steps.update-type.outputs.LOG_TYPE }}**: ${{ steps.pr-meta.outputs.title }} "
          ENTRY+="(PR #${{ steps.pr-meta.outputs.number }}, branch: ${{ steps.pr-meta.outputs.branch }})\n"

          echo -e "$ENTRY\n$(cat changelog.md)" > changelog.md

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version changelog.md
          git commit -m "[${{ steps.new-ver.outputs.VERSION }}] <.[${{ steps.current-ver.outputs.VERSION }}] ${{ steps.update-type.outputs.TYPE }} up"
          git push origin HEAD:main

      - name: Add PR labels
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              labels: [
                '${{ steps.new-ver.outputs.VERSION }}',
                'changelog'
              ]
            });

      - name: Archive changelog
        uses: actions/upload-artifact@v3
        with:
          name: changelog-${{ steps.new-ver.outputs.VERSION }}
          path: changelog.md
