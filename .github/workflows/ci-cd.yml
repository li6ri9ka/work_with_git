name: Version Update

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  update-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR labels
        id: pr-labels
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: ${{ github.event.pull_request.number }},
            });
            return pr.data.labels.map(label => label.name);

      - name: Determine version bump type
        id: version-bump
        run: |
          if [[ "${{ steps.pr-labels.outputs.result }}" == *"feature"* ]]; then
            echo "BUMP_TYPE=minor" >> $GITHUB_OUTPUT
          elif [[ "${{ steps.pr-labels.outputs.result }}" == *"hotfix"* ]]; then
            echo "BUMP_TYPE=patch" >> $GITHUB_OUTPUT
          else
            echo "No version bump needed"
            exit 0
          fi

      - name: Read current version
        id: current-version
        run: |
          if [ -f "version" ]; then
            CURRENT_VERSION=$(cat version)
          else
            CURRENT_VERSION="0.0.0"
          fi
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: new-version
        run: |
          IFS='.' read -ra VERSION <<< "${{ steps.current-version.outputs.CURRENT_VERSION }}"
          MAJOR=${VERSION[0]}
          MINOR=${VERSION[1]}
          PATCH=${VERSION[2]}

          if [ "${{ steps.version-bump.outputs.BUMP_TYPE }}" == "minor" ]; then
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="$MAJOR.$NEW_MINOR.0"
          elif [ "${{ steps.version-bump.outputs.BUMP_TYPE }}" == "patch" ]; then
            NEW_PATCH=$((PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update version file
        run: |
          echo "${{ steps.new-version.outputs.NEW_VERSION }}" > version

      - name: Commit version update
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version
          git commit -m "[${{ steps.new-version.outputs.NEW_VERSION }}] <.[${{ steps.current-version.outputs.CURRENT_VERSION }}] ${{ steps.version-bump.outputs.BUMP_TYPE }} up"
          git push origin HEAD:main

      - name: Add version label to PR
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              labels: ['${{ steps.new-version.outputs.NEW_VERSION }}']
            });
